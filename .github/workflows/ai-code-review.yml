name: AI code review

# Advisory second reader on pull requests to master: one sticky comment plus exactly one outcome label
# (ai-cr:passed | ai-cr:failed | ai-cr:skipped | ai-cr:error). Deliberately a separate file and NOT a required check:
# `ci.yml` and `deploy`'s `needs` know nothing about it.
#
# This is the one place CI holds a paid LLM key — a scoped, written exception to test-plan §7 ("CI holds no such
# keys") and §4 (no LLM judge in CI). It reaches exactly one step's env inside the composite action; no product
# test (unit, integration, e2e) ever holds or needs it. Spend is bounded by the pinned model, the turn cap and
# `max-budget-usd`, and is only incurred on opened / reopened / ready_for_review and an explicit `ai-cr:review`.
on:
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: read

jobs:
  review:
    # Same-repo PRs only: a fork's `pull_request` run gets no secrets, and `pull_request_target` would hand the key
    # to code from the fork. Dependabot runs get no Actions secrets either, so both would only ever end as `error`.
    # The label filter keeps every other label event (including the outcome labels) from spending money.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.state == 'open' &&
      (
        (
          contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) &&
          !github.event.pull_request.draft
        ) ||
        (github.event.action == 'labeled' && github.event.label.name == 'ai-cr:review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      # Creating labels is a repository-labels endpoint, which sits under `issues`.
      issues: write
    # Job-level, not workflow-level: a skipped job (an unrelated label) never enters the group, so it cannot cancel
    # a live review. `invalidate` shares the group, so a push cancels a review of the previous head.
    concurrency:
      group: ai-cr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Labels and comments below are written with GITHUB_TOKEN, whose events never trigger workflow runs — adding
      # an outcome label or removing `ai-cr:review` cannot start another review.
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "ai-cr:passed" --color 0E8A16 --description "AI code review passed (advisory)" --force
          gh label create "ai-cr:failed" --color B60205 --description "AI code review failed (advisory)" --force
          gh label create "ai-cr:skipped" --color BFBFBF --description "AI code review skipped: nothing reviewable" --force
          gh label create "ai-cr:error" --color FBCA04 --description "AI code review could not complete" --force
          gh label create "ai-cr:review" --color 1D76DB --description "Add to request an AI code review" --force

      - name: Clear outcome labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # An absent label answers 404, which is the state we want; anything else is a real failure.
          remove_label() {
            local out
            if ! out=$(gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$1" 2>&1); then
              case "$out" in *"HTTP 404"*) ;; *) echo "$out" >&2; return 1 ;; esac
            fi
          }
          for label in ai-cr:passed ai-cr:failed ai-cr:skipped ai-cr:error; do remove_label "$label"; done

      # The `pull_request` checkout is the PR's merge commit: HEAD^1 is the base tip, so HEAD^1..HEAD is exactly
      # what merging would change — and the reviewer package itself comes from that same commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      # The title and body are untrusted: they reach the shell only through `env:`, never `${{ }}` in `run:`.
      # `body` is null for an empty description.
      - name: Prepare review input
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          echo "Diff: $(wc -c < "$RUNNER_TEMP/pr.diff") bytes"

      # continue-on-error: the job's colour is decided by the last step from `result`, so a setup failure inside the
      # action still reaches the publish steps as `error`.
      - name: Review
        id: ai-review
        continue-on-error: true
        uses: ./.github/actions/ai-code-review
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          diff-path: ${{ runner.temp }}/pr.diff
          title: ${{ github.event.pull_request.title }}
          body-path: ${{ runner.temp }}/pr-body.md
          reviewed-sha: ${{ github.event.pull_request.head.sha }}
          model: claude-sonnet-5
          max-budget-usd: "1.00"
          max-turns: "5"

      # Runs on failure and cancellation too, so every run leaves a truthful comment. The head-SHA check is the
      # second guard behind `concurrency`: a review that finishes after new commits landed must not label a head it
      # never saw, so its comment is posted already marked outdated and no outcome label is applied.
      - name: Publish comment and outcome label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.ai-review.outputs.result }}
          MARKDOWN_PATH: ${{ steps.ai-review.outputs.markdown-path }}
        run: |
          marker='<!-- ai-cr:sticky -->'
          body_file="$RUNNER_TEMP/ai-cr-publish.md"

          case "$RESULT" in passed|failed|skipped|error) ;; *) RESULT=error ;; esac
          if [ -n "$MARKDOWN_PATH" ] && [ -f "$MARKDOWN_PATH" ]; then
            cp "$MARKDOWN_PATH" "$body_file"
          else
            RESULT=error
            # shellcheck disable=SC2016 # the backticks are literal markdown, not command substitution
            printf '%s\n\n%s\n\n%s\n' "$marker" '## ⚠️ AI code review: error' \
              'The review did not produce a result (it may have been cancelled; see the workflow run log). Add the `ai-cr:review` label to re-run.' > "$body_file"
          fi

          current_sha=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)
          head_matches=false
          if [ "$current_sha" = "$REVIEWED_SHA" ]; then
            head_matches=true
          else
            banner="> ⚠️ Outdated — commits were pushed after this review (now at ${current_sha:0:7}). Add the \`ai-cr:review\` label to re-run."
            { echo "$marker"; echo; echo "$banner"; tail -n +2 "$body_file"; } > "$body_file.tmp"
            mv "$body_file.tmp" "$body_file"
          fi

          # Upsert: only a bot-authored comment starting with the marker is ours to overwrite.
          comment_id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          payload=$(jq -n --rawfile body "$body_file" '{body: $body}')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" --input - <<< "$payload" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" --input - <<< "$payload" > /dev/null
          fi

          if [ "$head_matches" = true ]; then
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f "labels[]=ai-cr:$RESULT" > /dev/null
            echo "Applied ai-cr:$RESULT"
          else
            echo "::warning::Head moved from $REVIEWED_SHA to $current_sha during the review; no outcome label applied."
          fi

      - name: Remove the retry label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! out=$(gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/ai-cr:review" 2>&1); then
            case "$out" in *"HTTP 404"*) ;; *) echo "$out" >&2; exit 1 ;; esac
          fi

      # The only red outcome. `failed` and `skipped` are verdicts, not job failures — this workflow is advisory.
      - name: Fail the job on a review error
        if: always()
        env:
          RESULT: ${{ steps.ai-review.outputs.result }}
        run: |
          case "$RESULT" in
            passed|failed|skipped) echo "AI code review result: $RESULT" ;;
            *) echo "::error::AI code review ended as error (result: '${RESULT:-none}'). See the step summary and log."; exit 1 ;;
          esac

  invalidate:
    # A push makes any verdict stale. Nothing is reviewed or spent here: the labels go, the comment is marked
    # outdated, and a human re-runs with `ai-cr:review`. Same fork/Dependabot guard as `review`.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    # Shares `review`'s group: this job cancels a review still running for the previous head.
    concurrency:
      group: ai-cr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Remove outcome labels and mark the review outdated
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          remove_label() {
            local out
            if ! out=$(gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$1" 2>&1); then
              case "$out" in *"HTTP 404"*) ;; *) echo "$out" >&2; return 1 ;; esac
            fi
          }
          for label in ai-cr:passed ai-cr:failed ai-cr:skipped ai-cr:error; do remove_label "$label"; done

          marker='<!-- ai-cr:sticky -->'
          comment_id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -z "$comment_id" ]; then
            echo "No AI review comment on this PR; nothing to mark outdated."
            exit 0
          fi

          banner="> ⚠️ Outdated — commits were pushed after this review (now at ${HEAD_SHA:0:7}). Add the \`ai-cr:review\` label to re-run."
          # Marker, then the new banner, then the old body minus any earlier banner — banners replace, never stack.
          gh api "repos/$GH_REPO/issues/comments/$comment_id" \
            | jq --arg marker "$marker" --arg banner "$banner" '
                (.body | split("\n")) as $lines
                | ($lines[1:] | map(select(startswith("> ⚠️ Outdated — ") | not))) as $rest
                | ($rest | until(length == 0 or .[0] != ""; .[1:])) as $trimmed
                | {body: ([$marker, "", $banner, ""] + $trimmed | join("\n"))}' \
            | gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" --input - > /dev/null
          echo "Marked comment $comment_id outdated at ${HEAD_SHA:0:7}."
